<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de citas</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <main class="contenedor">
        <section class="panel panel-muy-grande">
            <h1>Administración de citas</h1>

            <p class="mensaje exito" th:if="${exito}" th:text="${exito}"></p>
            <p class="mensaje error" th:if="${error}" th:text="${error}"></p>

            <form class="filtros" th:action="@{/admin/citas}" method="get">
                <label>
                    Estado
                    <select name="estado">
                        <option value="">Todos</option>
                        <option th:each="estadoItem : ${estados}"
                                th:value="${estadoItem}"
                                th:text="${estadoItem}"
                                th:selected="${estado == estadoItem}"></option>
                    </select>
                </label>

                <label>
                    Médico
                    <select name="medicoId">
                        <option value="">Todos</option>
                        <option th:each="medico : ${medicos}"
                                th:value="${medico.id}"
                                th:text="${medico.nombre}"
                                th:selected="${medicoId != null and medico.id == medicoId}"></option>
                    </select>
                </label>

                <label>
                    Especialidad
                    <input type="text" name="especialidad" th:value="${especialidad}">
                </label>

                <label>
                    Fecha desde
                    <input type="date" name="fechaDesde" th:value="${fechaDesde}">
                </label>

                <label>
                    Fecha hasta
                    <input type="date" name="fechaHasta" th:value="${fechaHasta}">
                </label>

                <div class="acciones">
                    <button type="submit">Filtrar</button>
                    <a class="boton-secundario" th:href="@{/admin/citas}">Limpiar filtros</a>
                </div>
            </form>

            <div class="links">
                <a th:href="@{/disponibilidades}">Disponibilidades</a>
                <a th:href="@{/medicos}">Médicos</a>
                <a th:href="@{/inicio}">Volver al inicio</a>
            </div>

            <p th:if="${#lists.isEmpty(citas)}">No se encontraron citas con los filtros seleccionados.</p>

            <div class="tabla-contenedor" th:if="${!#lists.isEmpty(citas)}">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Paciente</th>
                            <th>Correo</th>
                            <th>Médico</th>
                            <th>Especialidad</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="cita : ${citas}">
                            <td th:text="${cita.id}"></td>
                            <td th:text="${cita.usuario.nombre}"></td>
                            <td th:text="${cita.usuario.correo}"></td>
                            <td th:text="${cita.medico.nombre}"></td>
                            <td th:text="${cita.medico.especialidad}"></td>
                            <td th:text="${#temporals.format(cita.fecha, 'dd/MM/yyyy')}"></td>
                            <td>
                                <span th:text="${#temporals.format(cita.horaInicio, 'HH:mm')}"></span>
                                -
                                <span th:text="${#temporals.format(cita.horaFin, 'HH:mm')}"></span>
                            </td>
                            <td>
                                <span class="estado"
                                      th:classappend="${cita.estado.name() == 'PENDIENTE' ? ' estado-pendiente' : (cita.estado.name() == 'CONFIRMADA' ? ' estado-confirmada' : ' estado-cancelada')}"
                                      th:text="${cita.estado}"></span>
                            </td>
                            <td>
                                <div class="acciones">
                                    <form class="form-inline" method="post"
                                          th:if="${cita.estado.name() == 'PENDIENTE'}"
                                          th:action="@{/admin/citas/confirmar/{id}(id=${cita.id})}">
                                        <input type="hidden"
                                               th:name="${_csrf.parameterName}"
                                               th:value="${_csrf.token}">
                                        <button type="submit" class="boton-confirmar">Confirmar</button>
                                    </form>

                                    <form class="form-inline" method="post"
                                          th:if="${cita.estado.name() != 'CANCELADA'}"
                                          th:action="@{/admin/citas/cancelar/{id}(id=${cita.id})}">
                                        <input type="hidden"
                                               th:name="${_csrf.parameterName}"
                                               th:value="${_csrf.token}">
                                        <button type="submit" class="boton-peligro">Cancelar</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
